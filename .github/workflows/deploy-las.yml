name: Deploy Light of Asia API to 38.54.4.61

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: las-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # This workflow deploys straight to production and previously ran no
      # tests at all. Nothing ships unless the suite and the security guard pass.
      - name: Run tests and security checks
        env:
          # Non-production placeholders, needed only so application config imports.
          SECRET_KEY: ci-test-secret-not-for-production
          DEEPSEEK_API_KEY: ci-test-key-not-for-production
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m compileall -q app
          python scripts/security_guard.py
          python -m pytest -q

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          # Prefer a key dedicated to THIS server. One key that opens both
          # schools' servers means a single leaked secret loses both at once.
          # Falls back to the shared key so nothing breaks before
          # LAS_SSH_PRIVATE_KEY is configured.
          ssh-private-key: ${{ secrets.LAS_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}

      - name: Rsync project files to Light of Asia Server
        run: |
          rsync -avz --delete \
            -e "ssh -o StrictHostKeyChecking=no" \
            --exclude '.git' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'venv' \
            --exclude 'uploads' \
            --exclude 'media' \
            --exclude 'migration_uploads' \
            --exclude '.env' \
            --exclude 'certs' \
            --exclude 'tmp' \
            ./ root@38.54.4.61:/opt/las-api/

      - name: Install dependencies, migrate and restart API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 38.54.4.61
          username: root
          # Same per-server key as the rsync step above. Missing this
          # second reference is what left the deploy half-migrated.
          key: ${{ secrets.LAS_SSH_PRIVATE_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            set -eu
            cd /opt/las-api

            # Install updated dependencies
            /opt/las-api/venv/bin/pip install --upgrade pip
            /opt/las-api/venv/bin/pip install -r requirements.txt

            # Restart service (runs complete startup migrations with systemd environment)
            systemctl daemon-reload
            systemctl restart las-api


            # Healthcheck
            sleep 3
            curl -f http://127.0.0.1:8001/health
