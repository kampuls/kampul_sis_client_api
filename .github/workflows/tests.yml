name: Tests & security checks

# The deploy workflows ship to production. This runs the full suite on every
# push and pull request so a regression is caught before it gets there — the
# deploy jobs previously ran only two test files out of forty.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Non-production placeholders, needed only so application config imports.
      SECRET_KEY: ci-test-secret-not-for-production
      DEEPSEEK_API_KEY: ci-test-key-not-for-production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Compile everything
        run: python -m compileall -q app

      - name: Security guard
        # Blocks the shapes of bugs this codebase has already had: membership
        # queries missing user_type, raw client filenames in path joins,
        # unauthenticated uploads, token lookups that skip the role claim.
        run: python scripts/security_guard.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run tests again
        # Not redundant: Redis counters and other shared state outlive a single
        # process, and an earlier version of the login-throttle tests passed on
        # the first run and failed on the second. A suite that is not repeatable
        # is not telling the truth.
        run: python -m pytest -q

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory: a brand-new CVE in a dependency should be visible, but it should
    # not block an unrelated bugfix from shipping.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Audit the SHIPPED set, not the dev set.
          python -m pip install -r requirements.txt
          python -m pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit --progress-spinner off
